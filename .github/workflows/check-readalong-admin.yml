name: Check Read Along Admin

on:
  push:
    branches:
      - beta
      - main
      - testing
    paths:
      - "admin/**"
      - "app.js"
      - "index.html"
      - "sw.js"
      - "modules/**"
      - "services/**"
      - "schemas/**"
      - "package.json"
      - "package-lock.json"
      - "tests/**"
      - ".github/workflows/check-readalong-admin.yml"
  workflow_dispatch:
  pull_request:
    branches:
      - beta
      - main
    paths:
      - "admin/**"
      - "app.js"
      - "index.html"
      - "sw.js"
      - "modules/**"
      - "services/**"
      - "schemas/**"
      - "package.json"
      - "package-lock.json"
      - "tests/**"
      - ".github/workflows/check-readalong-admin.yml"

# Workflow-level paths prevent documentation-only and unrelated pushes from creating runs.
# Full regression remains opt-in on matching pushes via [test] in the final commit message.
# PRs targeting beta/main remain automatically validated for the paths below.
concurrency:
  group: readalong-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression-and-isolation:
    if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[test]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # npm test already includes all unit/regression suites and check:js.
      # Do not repeat admin.js/catalog module syntax checks in separate steps.
      - name: Run regression tests and JavaScript syntax checks
        run: npm test
      - name: Check Pages Functions module syntax
        run: node --check --input-type=module < 'admin/functions/api/readalong-admin/[[path]].js'
      - name: Verify isolation constraints
        run: |
          ! grep -R -nE '(^|[^A-Z_])COMICS([^A-Z_]|$)|(^|[^A-Z_])TOTP_SECRET([^A-Z_]|$)|comic_manager_session' admin/functions admin/public
          grep -q 'READALONG' 'admin/functions/api/readalong-admin/[[path]].js'
          grep -q 'admin_totp_state' 'admin/functions/api/readalong-admin/[[path]].js'
      - name: Smoke test deployed analytics consent gate
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/beta' && contains(github.event.head_commit.message, '[test]') }}
        run: |
          node --input-type=module <<'NODE'
          const endpoint = 'https://read-along-admin.pages.dev/api/readalong-admin/analytics/events';
          const origin = 'capacitor://localhost';
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
          let ready = false;
          for (let attempt = 0; attempt < 18; attempt++) {
            try {
              const response = await fetch(endpoint, { method: 'OPTIONS', headers: { Origin: origin } });
              if (response.status === 204 && response.headers.get('access-control-allow-origin') === origin) {
                const rejected = await fetch(endpoint, {
                  method: 'POST',
                  headers: { Origin: origin, 'Content-Type': 'application/json' },
                  body: JSON.stringify({ consent: false, events: [] })
                });
                const body = await rejected.json();
                if (rejected.status !== 400 || body.error !== 'Analytics consent required') {
                  throw new Error('Consent gate returned an unexpected response: ' + rejected.status + ' ' + JSON.stringify(body));
                }
                ready = true;
                break;
              }
            } catch (error) {
              if (attempt === 17) throw error;
            }
            await wait(10000);
          }
          if (!ready) throw new Error('Analytics endpoint did not become ready with the expected CORS/consent behavior');
          const id = () => crypto.randomUUID().replace(/-/g, '');
          const installId = 'smoke_install_' + id();
          const sessionId = 'smoke_session_' + id();
          const eventId = 'smoke_event_' + id();
          const event = {
            schemaVersion: 1,
            eventId,
            sessionId,
            installId,
            sequence: 0,
            type: 'heartbeat',
            occurredAt: new Date().toISOString(),
            readingSeconds: 7,
            listeningSeconds: 11,
            platform: 'android',
            appVersion: 'smoke-test'
          };
          const send = async () => {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: { Origin: origin, 'Content-Type': 'application/json' },
              body: JSON.stringify({ consent: true, events: [event] })
            });
            return { status: response.status, body: await response.json() };
          };
          const first = await send();
          if (first.status !== 200 || first.body.ok !== true || first.body.accepted !== 1 || first.body.duplicates !== 0) {
            throw new Error('Valid analytics event was not accepted: ' + first.status + ' ' + JSON.stringify(first.body));
          }
          const replay = await send();
          if (replay.status !== 200 || replay.body.ok !== true || replay.body.accepted !== 0 || replay.body.duplicates !== 1) {
            throw new Error('Analytics replay was not idempotent: ' + replay.status + ' ' + JSON.stringify(replay.body));
          }
          const conflict = { ...event, eventId: 'smoke_conflict_' + id() };
          const conflictResponse = await fetch(endpoint, {
            method: 'POST',
            headers: { Origin: origin, 'Content-Type': 'application/json' },
            body: JSON.stringify({ consent: true, events: [conflict] })
          });
          const conflictBody = await conflictResponse.json();
          if (conflictResponse.status !== 200 || conflictBody.ok !== true || conflictBody.accepted !== 0 || conflictBody.duplicates !== 1) {
            throw new Error('Conflicting session sequence was not safely ignored: ' + conflictResponse.status + ' ' + JSON.stringify(conflictBody));
          }
          console.log('Deployed analytics CORS, consent, valid write, replay and sequence-conflict idempotency passed.');
          console.log('CLEANUP_SESSION_ID=' + sessionId);
          console.log('CLEANUP_INSTALL_ID=' + installId);
          NODE
