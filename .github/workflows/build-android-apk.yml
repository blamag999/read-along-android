name: Build and Release Read Along

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Generate release version and changelog from commits
        id: release_info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')"
          if [[ -n "$LAST_TAG" && "$LAST_TAG" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          else
            VERSION="1.0.0"
          fi
          if gh release view "v${VERSION}" >/dev/null 2>&1; then echo "Release v${VERSION} already exists"; exit 1; fi
          if [[ -n "$LAST_TAG" ]] && git rev-parse -q --verify "${LAST_TAG}^{commit}" >/dev/null; then
            CHANGELOG="$(git log --no-merges --pretty=format:'- %s (%h)' "${LAST_TAG}..HEAD")"
          else
            CHANGELOG="$(git log --no-merges --pretty=format:'- %s (%h)' -20)"
          fi
          if [[ -z "$CHANGELOG" ]]; then CHANGELOG="- Build from commit ${GITHUB_SHA:0:7}"; fi
          { echo "version=${VERSION}"; echo "changelog<<CHANGELOG_EOF"; echo "$CHANGELOG"; echo "CHANGELOG_EOF"; } >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare web assets
        run: npm run prepare:web

      - name: Embed release version in app
        env:
          VERSION: ${{ steps.release_info.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path('www/index.html')
          html = path.read_text()
          html, count = re.subn(r'(<meta\s+name="app-version"\s+content=")[^"]*(")', lambda m: m.group(1) + os.environ["VERSION"] + m.group(2), html, count=1)
          if count != 1: raise SystemExit('app-version meta tag not found')
          path.write_text(html)
          PY

      - name: Package versioned Web Local ZIP
        env:
          VERSION: ${{ steps.release_info.outputs.version }}
        run: |
          mkdir -p dist/read-along-web-local
          cp -R www/. dist/read-along-web-local/
          cp run_local.bat README-WEB-LOCAL.txt dist/read-along-web-local/
          cd dist && zip -r "read-along-v${VERSION}-web-local.zip" read-along-web-local

      - name: Install dependencies and integrate native updater
        run: |
          npm install
          npx cap add android
          mkdir -p android/app/src/main/java/com/blamag999/readalong android/app/src/main/res/xml
          cp native/android/ApkUpdaterPlugin.java android/app/src/main/java/com/blamag999/readalong/ApkUpdaterPlugin.java
          cp native/android/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          python3 - <<'PY'
          from pathlib import Path
          main = Path('android/app/src/main/java/com/blamag999/readalong/MainActivity.java')
          if not main.exists():
              candidates = list(Path('android/app/src/main/java').rglob('MainActivity.java'))
              if len(candidates) != 1: raise SystemExit('Could not locate generated MainActivity.java')
              main = candidates[0]
          source = main.read_text()
          if 'ApkUpdaterPlugin.class' not in source:
              marker = 'public class MainActivity extends BridgeActivity {'
              if marker not in source: raise SystemExit('Could not register ApkUpdaterPlugin in MainActivity')
              source = source.replace(marker, marker + '\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        registerPlugin(ApkUpdaterPlugin.class);\n        super.onCreate(savedInstanceState);\n    }', 1)
              main.write_text(source)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text()
          if 'REQUEST_INSTALL_PACKAGES' not in xml:
              xml = xml.replace('<application', '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application', 1)
          if '.fileprovider' not in xml:
              provider = '''<provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" /></provider>'''
              xml = xml.replace('</application>', provider + '\n    </application>', 1)
          manifest.write_text(xml)
          PY
          npx cap sync android

      - name: Set Android version
        env:
          VERSION: ${{ steps.release_info.outputs.version }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path('android/app/build.gradle')
          text = path.read_text()
          text, a = re.subn(r'versionCode\s+\d+', f'versionCode {os.environ["VERSION_CODE"]}', text, count=1)
          text, b = re.subn(r'versionName\s+["\'][^"\']+["\']', f'versionName "{os.environ["VERSION"]}"', text, count=1)
          if a != 1 or b != 1: raise SystemExit('Could not set Android versionCode/versionName')
          path.write_text(text)
          PY

      - name: Generate Android launcher icons from repository icon
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          import xml.etree.ElementTree as ET

          source = Path('icon.png')
          if not source.is_file():
              raise SystemExit('Repository icon.png is missing at the repository root')
          image = Image.open(source).convert('RGBA')
          if image.width < 1 or image.height < 1:
              raise SystemExit('icon.png is empty or invalid')

          res = Path('android/app/src/main/res')
          for density, size in [('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)]:
              folder = res / f'mipmap-{density}'
              folder.mkdir(parents=True, exist_ok=True)
              # Preserve the square logo and resize to the standard launcher size.
              fitted = ImageOps.fit(image, (size, size), method=Image.Resampling.LANCZOS)
              fitted.save(folder / 'ic_launcher.png', optimize=True)
              fitted.save(folder / 'ic_launcher_round.png', optimize=True)

              # Adaptive foreground: keep artwork inside a safe central area.
              safe_size = round(size * 0.64)
              foreground = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              artwork = ImageOps.contain(image, (safe_size, safe_size), method=Image.Resampling.LANCZOS)
              foreground.alpha_composite(artwork, ((size-artwork.width)//2, (size-artwork.height)//2))
              foreground.save(folder / 'ic_launcher_foreground.png', optimize=True)

          # Update PWA icon metadata to make the uploaded icon available in web builds.
          manifest_path = Path('manifest.json')
          manifest = manifest_path.read_text(encoding='utf-8')
          if 'icon.png' not in manifest:
              raise SystemExit('manifest.json no longer references icon.png')
          # Configure the generated Android manifest to use the generated launcher icons.
          manifest_file = Path('android/app/src/main/AndroidManifest.xml')
          xml = manifest_file.read_text(encoding='utf-8')
          xml = xml.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@mipmap/ic_launcher"')
          if 'android:roundIcon=' not in xml:
              xml = xml.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"', 1)
          manifest_file.write_text(xml, encoding='utf-8')
          print(f'Generated Android launcher icons from {source} ({image.width}x{image.height})')
          PY

      - name: Configure stable Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ runner.temp }}/read-along-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then echo "Configure all four Android signing secrets as described in README.md"; exit 1; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle')
          text = p.read_text()
          release_signing = '''release {
                      storeFile file(System.getenv("KEYSTORE_FILE"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }'''
          if not re.search(r'signingConfigs\s*\{[\s\S]*?\brelease\s*\{', text):
              if re.search(r'signingConfigs\s*\{', text):
                  text, count = re.subn(r'(signingConfigs\s*\{)', lambda m: m.group(1) + '\n        ' + release_signing, text, count=1)
              else:
                  text = text.replace('android {', 'android {\n    signingConfigs {\n        ' + release_signing + '\n    }', 1)
          pattern = r'(buildTypes\s*\{[\s\S]*?release\s*\{)'
          if not re.search(pattern + r'\s*signingConfig\s+signingConfigs\.release', text):
              text, count = re.subn(pattern, r'\1\n            signingConfig signingConfigs.release', text, count=1)
              if count != 1: raise SystemExit('Could not configure release signing')
          p.write_text(text)
          PY

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/read-along-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename versioned APK
        env:
          VERSION: ${{ steps.release_info.outputs.version }}
        run: cp android/app/build/outputs/apk/release/app-release.apk "read-along-v${VERSION}-android.apk"

      - name: Upload versioned workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: read-along-v${{ steps.release_info.outputs.version }}-build
          path: |
            read-along-v${{ steps.release_info.outputs.version }}-android.apk
            dist/read-along-v${{ steps.release_info.outputs.version }}-web-local.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release and attach files
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_info.outputs.version }}
          CHANGELOG: ${{ steps.release_info.outputs.changelog }}
        run: |
          gh release create "v${VERSION}" \
            "read-along-v${VERSION}-android.apk" \
            "dist/read-along-v${VERSION}-web-local.zip" \
            --title "Read Along v${VERSION}" \
            --notes "$CHANGELOG"
