name: Build and Release Read Along

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Generate release version and changelog from commits
        id: release_info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')"
          if [[ -n "$LAST_TAG" && "$LAST_TAG" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          else
            VERSION="1.0.0"
          fi

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists; refusing to overwrite it."
            exit 1
          fi

          if [[ -n "$LAST_TAG" ]] && git rev-parse -q --verify "${LAST_TAG}^{commit}" >/dev/null; then
            CHANGELOG="$(git log --no-merges --pretty=format:'- %s (%h)' "${LAST_TAG}..HEAD")"
          else
            CHANGELOG="$(git log --no-merges --pretty=format:'- %s (%h)' -20)"
          fi
          if [[ -z "$CHANGELOG" ]]; then
            CHANGELOG="- Build from commit ${GITHUB_SHA:0:7}"
          fi
          {
            echo "version=${VERSION}"
            echo "changelog<<CHANGELOG_EOF"
            echo "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"
          echo "Generated changelog from commits since ${LAST_TAG:-repository history}."

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare web assets
        run: npm run prepare:web

      - name: Embed release version in app
        env:
          VERSION: ${{ steps.release_info.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path('www/index.html')
          html = path.read_text()
          html, count = re.subn(r'(<meta name="app-version" content=")[^"]*(">)', rf'\g<1>{os.environ["VERSION"]}\g<2>', html, count=1)
          if count != 1:
              raise SystemExit('app-version meta tag not found in www/index.html')
          path.write_text(html)
          PY

      - name: Package versioned Web Local ZIP
        env:
          VERSION: ${{ steps.release_info.outputs.version }}
        run: |
          mkdir -p dist/read-along-web-local
          cp -R www/. dist/read-along-web-local/
          cp run_local.bat README-WEB-LOCAL.txt dist/read-along-web-local/
          cd dist
          zip -r "read-along-v${VERSION}-web-local.zip" read-along-web-local

      - name: Install dependencies and create Android project
        run: |
          npm install
          npx cap add android
          mkdir -p android/app/src/main/java/com/blamag999/readalong
          cp native/android/ApkUpdaterPlugin.java android/app/src/main/java/com/blamag999/readalong/ApkUpdaterPlugin.java
          mkdir -p android/app/src/main/res/xml
          cp native/android/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          python3 - <<'PY'
          from pathlib import Path
          import re
          main = Path('android/app/src/main/java/com/blamag999/readalong/MainActivity.java')
          if not main.exists():
              candidates = list(Path('android/app/src/main/java').rglob('MainActivity.java'))
              if len(candidates) != 1:
                  raise SystemExit('Could not locate generated MainActivity.java')
              main = candidates[0]
          source = main.read_text()
          if 'ApkUpdaterPlugin.class' not in source:
              source = source.replace('public class MainActivity extends BridgeActivity {',
                  'public class MainActivity extends BridgeActivity {\n'
                  '    @Override\n'
                  '    public void onCreate(android.os.Bundle savedInstanceState) {\n'
                  '        registerPlugin(ApkUpdaterPlugin.class);\n'
                  '        super.onCreate(savedInstanceState);\n'
                  '    }')
              main.write_text(source)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text()
          if 'REQUEST_INSTALL_PACKAGES' not in xml:
              xml = xml.replace('<manifest ', '<manifest xmlns:android="http://schemas.android.com/apk/res/android" ', 1) if 'xmlns:android=' not in xml else xml
              xml = xml.replace('<application', '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application', 1)
          if '.fileprovider' not in xml:
              provider = '''
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              '''
              xml = xml.replace('</application>', provider + '\n    </application>', 1)
          manifest.write_text(xml)
          PY
          npx cap sync android

      - name: Set Android version
        env:
          VERSION: ${{ steps.release_info.outputs.version }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path("android/app/build.gradle")
          text = path.read_text()
          text, code_count = re.subn(r'versionCode\s+\d+', f'versionCode {os.environ["VERSION_CODE"]}', text, count=1)
          text, name_count = re.subn(r'versionName\s+["\'][^"\']+["\']', f'versionName "{os.environ["VERSION"]}"', text, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not set Android versionCode/versionName in generated build.gradle")
          path.write_text(text)
          print(f"Set Android versionName={os.environ['VERSION']}, versionCode={os.environ['VERSION_CODE']}")
          PY

      - name: Configure stable Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_FILE: ${{ runner.temp }}/read-along-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Missing Android signing secrets. See README.md and configure all four secrets before building."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle')
          text = p.read_text()
          if 'signingConfigs {' not in text:
              text = text.replace('android {', '''android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_FILE"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          ''', 1)
          if not re.search(r'buildTypes\\s*\\{', text):
              raise SystemExit('buildTypes block not found')
          pattern = r'(buildTypes\\s*\\{[\\s\\S]*?release\\s*\\{)'
          if not re.search(pattern + r'\\s*signingConfig\\s+signingConfigs\\.release', text):
              text, count = re.subn(pattern, r'\\1\\n            signingConfig signingConfigs.release', text, count=1)
              if count != 1:
                  raise SystemExit('Could not configure release signing')
          p.write_text(text)
          PY

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/read-along-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename versioned APK
        env:
          VERSION: ${{ steps.release_info.outputs.version }}
        run: cp android/app/build/outputs/apk/release/app-release.apk "read-along-v${VERSION}-android.apk"

      - name: Upload versioned workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: read-along-v${{ steps.release_info.outputs.version }}-build
          path: |
            read-along-v${{ steps.release_info.outputs.version }}-android.apk
            dist/read-along-v${{ steps.release_info.outputs.version }}-web-local.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release and attach files
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_info.outputs.version }}
          CHANGELOG: ${{ steps.release_info.outputs.changelog }}
        run: |
          gh release create "v${VERSION}" \
            "read-along-v${VERSION}-android.apk" \
            "dist/read-along-v${VERSION}-web-local.zip" \
            --title "Read Along v${VERSION}" \
            --notes "$CHANGELOG      - name: Configure stable Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_FILE: ${{ runner.temp }}/read-along-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Missing signing secrets. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD in repository Actions secrets."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle')
          text = p.read_text()
          if 'signingConfigs {' not in text:
              text = text.replace('android {', '''android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_FILE"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          ''', 1)
          if not re.search(r'buildTypes\s*\{', text):
              raise SystemExit('buildTypes block not found')
          if not re.search(r'buildTypes\s*\{[\s\S]*?release\s*\{\s*signingConfig\s+signingConfigs\.release', text):
              text, count = re.subn(r'(buildTypes\s*\{[\s\S]*?release\s*\{)', r'\1\n            signingConfig signingConfigs.release', text, count=1)
              if count != 1:
                  raise SystemExit('Could not configure release signing')
          p.write_text(text)
          PY

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/read-along-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename versioned APK
        env:
          VERSION: ${{ steps.release_info.outputs.version }}
        run: cp android/app/build/outputs/apk/release/app-release.apk "read-along-v${VERSION}-android.apk"

      - name: Upload versioned workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: read-along-v${{ steps.release_info.outputs.version }}-build
          path: |
            read-along-v${{ steps.release_info.outputs.version }}-android.apk
            dist/read-along-v${{ steps.release_info.outputs.version }}-web-local.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release and attach files
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_info.outputs.version }}
          CHANGELOG: ${{ steps.release_info.outputs.changelog }}
        run: |
          gh release create "v${VERSION}" \
            "read-along-v${VERSION}-android.apk" \
            "dist/read-along-v${VERSION}-web-local.zip" \
            --title "Read Along v${VERSION}" \
            --notes "$CHANGELOG"