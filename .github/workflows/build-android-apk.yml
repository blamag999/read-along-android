name: Build and Release Read Along

on:
  # Beta APK is built only from an explicitly marked finalization commit that changes
  # an APK-relevant path. Documentation/backend-only pushes do not create this run.
  push:
    branches:
      - beta
    paths:
      - "app.js"
      - "index.html"
      - "styles.css"
      - "manifest.json"
      - "sw.js"
      - "icon.png"
      - "www/**"
      - "modules/**"
      - "services/**"
      - "scripts/prepare-web.js"
      - "native/**"
      - "android/**"
      - "capacitor.config.*"
      - "package.json"
      - "package-lock.json"
      - "run_local.bat"
      - "README-WEB-LOCAL.txt"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel (stable is allowed only from main)"
        required: true
        type: choice
        options:
          - beta
          - stable
        default: beta

permissions:
  contents: write

jobs:
  build-release:
    # Matching push builds are gated by [build-apk] in the final commit message.
    # Manual dispatch remains available for an explicitly requested release.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-apk]')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected workflow ref
        uses: actions/checkout@v6
        with:
          # Build the branch selected in Actions > Run workflow, not always main.
          ref: ${{ github.ref }}
          fetch-depth: 0

      # The exact APK commit always runs the complete regression suite first.
      - name: Set up Node.js for validation
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Node dependencies
        run: npm install

      - name: Run full regression suite before APK build
        run: npm test

      - name: Check Pages Functions module syntax
        run: node --check --input-type=module < 'admin/functions/api/readalong-admin/[[path]].js'

      - name: Verify isolation constraints
        run: |
          ! grep -R -nE '(^|[^A-Z_])COMICS([^A-Z_]|$)|(^|[^A-Z_])TOTP_SECRET([^A-Z_]|$)|comic_manager_session' admin/functions admin/public
          grep -q 'READALONG' 'admin/functions/api/readalong-admin/[[path]].js'
          grep -q 'admin_totp_state' 'admin/functions/api/readalong-admin/[[path]].js'

      - name: Validate release channel
        env:
          CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'beta' }}
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [[ "$CHANNEL" == "stable" && "$SELECTED_REF" != "refs/heads/main" ]]; then
            echo "Official releases can only be built from main. Select channel=beta for feature branches."
            exit 1
          fi

      - name: Generate release version and changelog from commits
        id: release_info
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'beta' }}
        run: |
          RELEASES="$(gh release list --limit 100 --json tagName,isPrerelease,publishedAt)"
          export RELEASES
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          releases = json.loads(os.environ["RELEASES"])
          channel = os.environ["CHANNEL"]
          parsed = []
          for release in releases:
              match = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)(?:-beta\.(\d+))?", release.get("tagName", ""))
              if not match:
                  continue
              major, minor, patch = map(int, match.group(1, 2, 3))
              beta_seq = int(match.group(4)) if match.group(4) is not None else None
              parsed.append({**release, "version": (major, minor, patch), "beta_seq": beta_seq})

          stable_releases = [r for r in parsed if not r.get("isPrerelease") and r["beta_seq"] is None]
          latest_stable = max((r["version"] for r in stable_releases), default=(1, 1, 0))
          stable_major, stable_minor, stable_patch = latest_stable

          if channel == "stable":
              # Stable increments the minor version: 1.1.0 -> 1.2.0 -> 1.3.0.
              version = f"{stable_major}.{stable_minor + 1}.0"
              prerelease = "false"
          else:
              # Continue the newest prerelease minor line if it is ahead of stable.
              # Beta versions are plain x.y.z; GitHub's prerelease flag marks the channel.
              prerelease_releases = [
                  r for r in parsed
                  if r.get("isPrerelease") and r["version"][0] == stable_major
              ]
              ahead_minors = [
                  r["version"][1] for r in prerelease_releases
                  if r["version"][1] > stable_minor
              ]
              beta_minor = max(ahead_minors) if ahead_minors else stable_minor
              beta_candidates = [
                  r for r in prerelease_releases if r["version"][1] == beta_minor
              ]
              baseline_patch = stable_patch if beta_minor == stable_minor else -1
              max_beta_patch = max((r["version"][2] for r in beta_candidates), default=baseline_patch)
              next_patch = max(baseline_patch, max_beta_patch) + 1
              version = f"{stable_major}.{beta_minor}.{next_patch}"
              prerelease = "true"

          print(f"version={version}")
          print(f"prerelease={prerelease}")
          PY
          VERSION="$(grep '^version=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
          LAST_TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')"
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "Release v$VERSION already exists"; exit 1; fi
          if [[ -n "$LAST_TAG" ]] && git rev-parse -q --verify "$LAST_TAG^{commit}" >/dev/null; then
            CHANGELOG="$(git log --no-merges --pretty=format:'- %s (%h)' "$LAST_TAG..HEAD")"
          else
            CHANGELOG="$(git log --no-merges --pretty=format:'- %s (%h)' -20)"
          fi
          if [[ -z "$CHANGELOG" ]]; then CHANGELOG="- Build from commit $(git rev-parse --short HEAD)"; fi
          { echo "changelog<<CHANGELOG_EOF"; echo "$CHANGELOG"; echo "CHANGELOG_EOF"; } >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"
          echo "Release channel: $CHANNEL"
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare web assets
        run: npm run prepare:web

      - name: Embed release version in app
        env:
          VERSION: ${{ steps.release_info.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path('www/index.html')
          html = path.read_text()
          html, count = re.subn(r'(<meta\s+name="app-version"\s+content=")[^"]*(")', lambda m: m.group(1) + os.environ["VERSION"] + m.group(2), html, count=1)
          if count != 1: raise SystemExit('app-version meta tag not found')
          path.write_text(html)
          PY

      - name: Package versioned Web Local ZIP
        env:
          VERSION: ${{ steps.release_info.outputs.version }}
        run: |
          mkdir -p dist/read-along-web-local
          cp -R www/. dist/read-along-web-local/
          cp run_local.bat README-WEB-LOCAL.txt dist/read-along-web-local/
          cd dist && zip -r "read-along-v${VERSION}-web-local.zip" read-along-web-local

      - name: Integrate native updater
        run: |
          npx cap add android
          mkdir -p android/app/src/main/java/com/blamag999/readalong android/app/src/main/res/xml
          cp native/android/ApkUpdaterPlugin.java android/app/src/main/java/com/blamag999/readalong/ApkUpdaterPlugin.java
          cp native/android/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          cp native/android/DiagnosticsPlugin.java android/app/src/main/java/com/blamag999/readalong/DiagnosticsPlugin.java
          python3 - <<'PY'
          from pathlib import Path
          main = Path('android/app/src/main/java/com/blamag999/readalong/MainActivity.java')
          if not main.exists():
              candidates = list(Path('android/app/src/main/java').rglob('MainActivity.java'))
              if len(candidates) != 1: raise SystemExit('Could not locate generated MainActivity.java')
              main = candidates[0]
          source = main.read_text()
          marker = 'public class MainActivity extends BridgeActivity {'
          if marker not in source: raise SystemExit('Could not locate MainActivity class declaration')
          # Remove previous Activity lifecycle overrides if this script is run on older generated source.
          import re
          source = re.sub(r'(?m)^\s*@Override\s+protected void onResume\(\)\s*\{\s*super\.onResume\(\);\s*DiagnosticsPlugin\.recordLifecycle\(this,\s*"Activity\.onResume"\);\s*\}\s*$', '', source)
          source = re.sub(r'(?m)^\s*@Override\s+protected void onPause\(\)\s*\{\s*DiagnosticsPlugin\.recordLifecycle\(this,\s*"Activity\.onPause"\);\s*super\.onPause\(\);\s*\}\s*$', '', source)
          source = re.sub(r'(?m)^\s*@Override\s+protected void onDestroy\(\)\s*\{\s*DiagnosticsPlugin\.recordLifecycle\(this,\s*"Activity\.onDestroy"\);\s*super\.onDestroy\(\);\s*\}\s*$', '', source)
          if 'ApkUpdaterPlugin.class' not in source:
              injected = marker + '\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        registerPlugin(ApkUpdaterPlugin.class);\n        registerPlugin(DiagnosticsPlugin.class);\n        DiagnosticsPlugin.recordLifecycle(this, "Activity.onCreate");\n        super.onCreate(savedInstanceState);\n    }'
              source = source.replace(marker, injected, 1)
          if re.search(r'protected void on(?:Resume|Pause|Destroy)\s*\(', source):
              raise SystemExit('Obsolete Activity lifecycle override remained in MainActivity')
          main.write_text(source)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text()
          # Keep the Capacitor WebView alive across orientation/size changes. If
          # Android recreates the Activity, the HTML audio element and its position
          # are lost and the reader appears to restart the page audio.
          import re
          activity_match = re.search(r'<activity\b[^>]*MainActivity[^>]*>', xml)
          if not activity_match:
              raise SystemExit('Could not locate the generated MainActivity declaration')
          activity_tag = activity_match.group(0)
          required_config_changes = [
              'orientation', 'screenSize', 'smallestScreenSize', 'screenLayout',
              'uiMode', 'keyboard', 'keyboardHidden', 'navigation', 'locale',
              'layoutDirection'
          ]
          config_match = re.search(r'android:configChanges="([^"]*)"', activity_tag)
          existing = config_match.group(1).split('|') if config_match else []
          merged = list(dict.fromkeys(existing + required_config_changes))
          config_value = '|'.join(merged)
          if config_match:
              updated_tag = activity_tag[:config_match.start(1)] + config_value + activity_tag[config_match.end(1):]
          else:
              updated_tag = activity_tag[:-1] + ' android:configChanges="' + config_value + '">'
          xml = xml.replace(activity_tag, updated_tag, 1)
          # One APK for touch and non-touch devices, including Android TV/Google TV.
          features = [
              '<uses-feature android:name="android.hardware.touchscreen" android:required="false" />',
              '<uses-feature android:name="android.software.leanback" android:required="false" />',
          ]
          for feature in features:
              feature_name = 'android:name="' + feature.split('android:name="', 1)[1].split('"', 1)[0] + '"'
              if feature_name not in xml:
                  xml = xml.replace('<application', feature + '\n    <application', 1)
          # Expose the same activity to Android TV launchers as well as phone launchers.
          if 'android.intent.category.LEANBACK_LAUNCHER' not in xml:
              launcher_category = '<category android:name="android.intent.category.LAUNCHER" />'
              if launcher_category not in xml:
                  raise SystemExit('Could not find the generated launcher category')
              xml = xml.replace(
                  launcher_category,
                  launcher_category + '\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />',
                  1
              )
          if 'REQUEST_INSTALL_PACKAGES' not in xml:
              xml = xml.replace('<application', '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application', 1)
          if '.fileprovider' not in xml:
              provider = '''<provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" /></provider>'''
              xml = xml.replace('</application>', provider + '\n    </application>', 1)
          manifest.write_text(xml)
          PY
          npx cap sync android

      - name: Set Android version
        env:
          VERSION: ${{ steps.release_info.outputs.version }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path('android/app/build.gradle')
          text = path.read_text()
          text, a = re.subn(r'versionCode\s+\d+', f'versionCode {os.environ["VERSION_CODE"]}', text, count=1)
          text, b = re.subn(r'versionName\s+["\'][^"\']+["\']', f'versionName "{os.environ["VERSION"]}"', text, count=1)
          if a != 1 or b != 1: raise SystemExit('Could not set Android versionCode/versionName')
          path.write_text(text)
          PY

      - name: Generate Android launcher icons from repository icon
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          source = Path('icon.png')
          if not source.is_file():
              raise SystemExit('Repository icon.png is missing at the repository root')
          image = Image.open(source).convert('RGBA')
          if image.width < 1 or image.height < 1:
              raise SystemExit('icon.png is empty or invalid')

          res = Path('android/app/src/main/res')
          for density, size in [('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)]:
              folder = res / f'mipmap-{density}'
              folder.mkdir(parents=True, exist_ok=True)
              # Keep the full source artwork visible rather than cropping the wordmark.
              fitted = ImageOps.contain(image, (size, size), method=Image.Resampling.LANCZOS)
              canvas = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              canvas.alpha_composite(fitted, ((size-fitted.width)//2, (size-fitted.height)//2))
              canvas.save(folder / 'ic_launcher.png', optimize=True)
              canvas.save(folder / 'ic_launcher_round.png', optimize=True)

              # Adaptive foreground: maintain transparency and keep logo inside safe zone.
              safe_size = round(size * 0.64)
              artwork = ImageOps.contain(image, (safe_size, safe_size), method=Image.Resampling.LANCZOS)
              foreground = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              foreground.alpha_composite(artwork, ((size-artwork.width)//2, (size-artwork.height)//2))
              foreground.save(folder / 'ic_launcher_foreground.png', optimize=True)

          # Update PWA icon metadata to make the uploaded icon available in web builds.
          manifest_path = Path('manifest.json')
          manifest = manifest_path.read_text(encoding='utf-8')
          if 'icon.png' not in manifest:
              raise SystemExit('manifest.json no longer references icon.png')
          # Configure the generated Android manifest to use the generated launcher icons.
          manifest_file = Path('android/app/src/main/AndroidManifest.xml')
          xml = manifest_file.read_text(encoding='utf-8')
          import re
          if 'android:icon="@mipmap/ic_launcher"' not in xml:
              xml, count = re.subn(r'<application\b', '<application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"', xml, count=1)
              if count != 1: raise SystemExit('Could not configure Android launcher icon')
          elif 'android:roundIcon=' not in xml:
              xml = xml.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"', 1)
          manifest_file.write_text(xml, encoding='utf-8')
          print(f'Generated Android launcher icons from {source} ({image.width}x{image.height})')
          PY

      - name: Configure stable Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ runner.temp }}/read-along-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then echo "Configure all four Android signing secrets as described in README.md"; exit 1; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle')
          text = p.read_text()
          release_signing = '''release {
                      storeFile file(System.getenv("KEYSTORE_FILE"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }'''
          if not re.search(r'signingConfigs\s*\{[\s\S]*?\brelease\s*\{', text):
              if re.search(r'signingConfigs\s*\{', text):
                  text, count = re.subn(r'(signingConfigs\s*\{)', lambda m: m.group(1) + '\n        ' + release_signing, text, count=1)
              else:
                  text = text.replace('android {', 'android {\n    signingConfigs {\n        ' + release_signing + '\n    }', 1)
          pattern = r'(buildTypes\s*\{[\s\S]*?release\s*\{)'
          if not re.search(pattern + r'\s*signingConfig\s+signingConfigs\.release', text):
              text, count = re.subn(pattern, r'\1\n            signingConfig signingConfigs.release', text, count=1)
              if count != 1: raise SystemExit('Could not configure release signing')
          p.write_text(text)
          PY

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/read-along-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename and verify signed APK
        env:
          VERSION: ${{ steps.release_info.outputs.version }}
        run: |
          APK="read-along-v${VERSION}-android.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Publish OTA objects to Cloudflare R2 (optional during migration)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_UPLOAD_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ steps.release_info.outputs.version }}
          VERSION_CODE: ${{ github.run_number }}
          RELEASE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'beta' }}
          CHANGELOG: ${{ steps.release_info.outputs.changelog }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::warning::Cloudflare R2 upload skipped. Configure CLOUDFLARE_R2_UPLOAD_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable OTA publishing."
            exit 0
          fi

          if [[ "$RELEASE_CHANNEL" == "stable" ]]; then CHANNEL="official"; else CHANNEL="beta"; fi
          APK="read-along-v${VERSION}-android.apk"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          export SHA256
          mkdir -p dist/ota
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          version = os.environ["VERSION"]
          channel = "official" if os.environ["RELEASE_CHANNEL"] == "stable" else "beta"
          filename = f"read-along-v{version}-android.apk"
          payload = {
              "schemaVersion": 1,
              "channel": channel,
              "version": version,
              "versionCode": int(os.environ["VERSION_CODE"]),
              "filename": filename,
              "size": os.path.getsize(filename),
              "sha256": os.environ["SHA256"],
              "notes": os.environ.get("CHANGELOG", "")[:4000],
              "mandatory": False,
              "publishedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
          }
          with open("dist/ota/latest.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, separators=(",", ":"))
          PY
          npx --yes wrangler@4 r2 object put "read-along-releases/releases/$CHANNEL/$APK" --file="$APK" --remote --content-type="application/vnd.android.package-archive" --cache-control="public, max-age=31536000, immutable" --header="x-amz-meta-sha256:$SHA256"
          npx --yes wrangler@4 r2 object put "read-along-releases/channels/$CHANNEL/latest.json" --file="dist/ota/latest.json" --remote --content-type="application/json" --cache-control="no-store"
          echo "Published OTA manifest for $CHANNEL $VERSION (sha256=$SHA256)"

      - name: Upload versioned workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: read-along-v${{ steps.release_info.outputs.version }}-build
          path: |
            read-along-v${{ steps.release_info.outputs.version }}-android.apk
            read-along-v${{ steps.release_info.outputs.version }}-android.apk.sha256
            dist/read-along-v${{ steps.release_info.outputs.version }}-web-local.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release and attach files
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_info.outputs.version }}
          PRERELEASE: ${{ steps.release_info.outputs.prerelease }}
          CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'beta' }}
          CHANGELOG: ${{ steps.release_info.outputs.changelog }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          TITLE="Read Along v$VERSION"
          if [[ "$CHANNEL" == "beta" ]]; then TITLE="Read Along Beta v$VERSION"; fi

          ARGS=()
          if [[ "$PRERELEASE" == "true" ]]; then ARGS+=(--prerelease); fi

          # Retry transient GitHub API errors. Before each retry, check whether
          # the previous request actually created the release despite returning an error.
          for attempt in 1 2 3; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists; skip creation to avoid duplicates."
              exit 0
            fi

            if gh release create "$TAG" \
              "read-along-v$VERSION-android.apk" \
              "read-along-v$VERSION-android.apk.sha256" \
              "dist/read-along-v$VERSION-web-local.zip" \
              --title "$TITLE" \
              --notes "$CHANGELOG" \
              "${ARGS[@]}"; then
              exit 0
            fi

            echo "GitHub Release creation attempt $attempt failed."
            if [[ "$attempt" -lt 3 ]]; then sleep $((attempt * 10)); fi
          done

          echo "Failed to create $TAG after 3 attempts." >&2
          exit 1
